/* Layout: a Figma-like design canvas (top bar, layers left, notes right, pannable canvas centre)

@font-face{font-family:"Black Magic";src:url("assets/fonts/BlackMagicSlabSerif.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}

:root{
  --warm-white:#FFFAF4;--cream:#FBF2E5;--oat:#F4EAD9;--blush:#F9DFD3;
  --rust:#BC6A37;--olive:#5F6742;--lavender:#817EB9;
  --marigold:#F2B739;--forest:#37524F;--periwinkle:#C4CFEF;--peach:#F4C5B4;
  --butter:#F2EAB7;--lime-sage:#BBCD7D;--pale-lime:#CCDD91;--indigo:#494E74;
  --terracotta:#E49D80;--walnut:#7C522E;--rose-brown:#A06360;--charcoal:#3B3D3C;
  --pink:#EC9DB6;--magenta:#A8286B;--plum:#4E2C61;--ember:#D4773A;--night-blue:#5764A6;--dusty-lilac:#D8CDE8;--dusty-blue:#C9D4EC;--dusty-pink:#EFC9D4;--dusty-mint:#C8E2D5;--dusty-apricot:#F3D2BA;--dusty-butter:#F2E6BE;--dusty-sky:#C3DDE8;--dusty-lime:#DCE6B9;--dusty-blush:#F4D6CC;
  --map-sage:#E1E4D5;--pine-dark:#2F6B57;--pine-light:#8FB3A0;
  --paper:color-mix(in srgb,var(--warm-white) 70%,var(--cream));
  --board:#f5ecdb;
  --ink:var(--charcoal);--ink-soft:#71706b;
  --line:var(--forest);
  --tape-clear:rgba(244,234,217,0.58);
  --tape-clear-edge:rgba(124,82,46,0.14);
  --shadow-paper:0 1px 0 rgba(59,61,60,.10),0 10px 24px rgba(59,61,60,.12);
  --shadow-hard:4px 4px 0 var(--charcoal);
  --f-head:"Black Magic",Georgia,serif;
  --f-body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-type:"Anonymous Pro","Courier New",monospace;
  --f-hand:"Caveat","Bradley Hand",cursive;
  color-scheme:light;
}
:root{
  /* canvas chrome (the "Figma" around the designs) */
  --ui-bg:#F4F3F0;--ui-panel:#FFFFFF;--ui-line:#E2E0DB;--ui-text:#2A2927;--ui-soft:#6F6B64;--ui-accent:#5764A6;
  --ui-accent-soft:#E6E8F4;--ui-canvas:#E7E5E0;--ui-dot:#D3D0C9;--ui-sticky:#FFF1B0;--ui-sticky-ink:#3B3D3C;
  --ui-font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;
  /* frame tokens (the designs themselves; fixed, same in both themes) */
  --f-head:"Black Magic",Georgia,serif;--f-body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-type:"Anonymous Pro","Courier New",monospace;--f-hand:"Caveat","Bradley Hand",cursive;
  --night:#2E1B3D;
}

:root[data-theme="dark"]{

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ui-bg);color:var(--ui-text);font:13px/1.45 var(--ui-font);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}

/* ---------- app chrome ---------- */
.app{display:grid;height:100%;grid-template-columns:232px minmax(0,1fr) 340px;grid-template-rows:48px minmax(0,1fr);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--ui-panel);border-bottom:1px solid var(--ui-line)}

.logo svg{width:18px;height:18px}
.tools{display:flex;gap:2px}
.tool{width:32px;height:32px;border-radius:6px;border:0;background:transparent;display:grid;place-items:center;color:var(--ui-soft)}
.tool[aria-pressed="true"]{background:var(--ui-accent-soft);color:var(--ui-accent)}

.zoom button:hover{background:var(--ui-accent-soft)}
.zoom output{min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.present{border:0;background:var(--ui-accent);color:var(--ui-panel);height:30px;padding:0 14px;border-radius:7px;font-weight:600;cursor:pointer;white-space:nowrap}
.left,.right{background:var(--ui-panel);overflow:auto;min-height:0}
.left{border-right:1px solid var(--ui-line);padding:10px 8px}
.right{border-left:1px solid var(--ui-line);padding:16px 18px 40px}

.page-item,.layer{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:6px;cursor:pointer}
.page-item[aria-current="true"]{font-weight:600}
.layer:hover,.page-item:hover{background:var(--ui-accent-soft)}
.layer[aria-current="true"]{background:var(--ui-accent-soft);color:var(--ui-accent);font-weight:600}
.layer svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5}
.layer.sec{font-weight:600;cursor:default}.layer.sec:hover{background:transparent}
.layer.sub{padding-left:28px}
.right h2{font-size:15px;margin:0 0 2px;font-weight:650;text-wrap:balance}
.right .meta{color:var(--ui-soft);font-size:12px;margin:0 0 14px}
.right h3{font-size:11px;font-weight:600;color:var(--ui-soft);margin:18px 0 6px;letter-spacing:.02em}
.right p,.right li{margin:0 0 8px}

.specs{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px}
.specs dt{color:var(--ui-soft)}.specs dd{margin:0}

/* ---------- canvas ---------- */
#vp{position:relative;overflow:hidden;background:var(--ui-canvas);touch-action:none;cursor:grab;min-height:0;
  background-image:radial-gradient(var(--ui-dot) 1px,transparent 1.2px);background-size:22px 22px}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.frame{position:absolute;width:3840px;height:2160px}
.flabel{position:absolute;left:0;bottom:100%;margin-bottom:calc(6px / var(--z,1));font:500 calc(12px / var(--z,1))/1.2 var(--ui-font);color:var(--ui-soft);white-space:nowrap;cursor:pointer;border:0;background:transparent;padding:0}
.frame.sel .flabel{color:var(--ui-accent);font-weight:650}
.frame.sel .fbody{outline:calc(2px / var(--z,1)) solid var(--ui-accent)}
.fbody{position:relative;width:3840px;height:2160px;overflow:hidden;box-shadow:0 2px 30px rgba(0,0,0,.18)}
.wtitle{position:absolute;font:700 230px/1 var(--ui-font);letter-spacing:-.02em;color:var(--ui-text);white-space:nowrap}
.wsub{position:absolute;width:3840px;font:400 96px/1.25 var(--ui-font);color:var(--ui-soft)}
.sticky{position:absolute;background:var(--ui-sticky);color:var(--ui-sticky-ink);font:500 78px/1.3 var(--ui-font);padding:80px 90px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.sticky b{display:block;font-size:96px;margin-bottom:24px}

/* present mode */
#present{position:fixed;inset:0;z-index:50;background:#141313;display:grid;grid-template-rows:auto 1fr}
#present[hidden]{display:none!important}
.pbar{display:flex;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));color:#ECEAE5;flex-wrap:wrap}
.pbar button{border:1px solid #3d3b38;background:#252422;color:#ECEAE5;height:32px;padding:0 12px;border-radius:7px;cursor:pointer}

.pbar .sp{flex:1}
#pstage{position:relative;overflow:hidden}
#pstage .fbody{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:none}

/* ================= shared frame pieces ================= */
:where(.fbody button){all:unset;box-sizing:border-box;cursor:pointer}
.fbody button:focus-visible{outline:6px solid var(--marigold);outline-offset:6px}
.face{display:block;width:100%;height:100%}

.initials b{font-family:var(--f-head);font-style:italic;font-weight:800;font-size:calc(var(--d) * .34);color:var(--it,var(--rust));line-height:1;margin-top:-.12em}
.initials i{position:absolute;inset:9%;border-radius:50%;border:max(2px,calc(var(--d) * .012)) dashed color-mix(in srgb,var(--it,var(--rust)) 60%,transparent)}

.badge-svg{display:block;width:100%;height:auto;overflow:visible}
.qr{display:block;background:#fff;padding:6%;border-radius:6px}
.qr svg{display:block;width:100%;height:auto}
.stamp{font:700 22px/1 var(--f-type);letter-spacing:.14em;text-transform:uppercase;padding:8px 12px 7px;border-radius:5px;color:var(--warm-white);display:inline-block;white-space:nowrap}
.stamp.pitch{background:var(--forest)}.stamp.talk{background:var(--magenta)}
.dl{height:20px;border-radius:99px;background:color-mix(in srgb,var(--warm-white) 20%,transparent);overflow:hidden;position:relative}
.dl i{position:absolute;inset:0 auto 0 0;width:var(--p,30%);background:linear-gradient(90deg,var(--pink),var(--marigold),var(--lime-sage),var(--dusty-sky));border-radius:99px}

/* ================= OPTION A · Pinboard Pages (day) ================= */
.fa{background:var(--board);color:var(--ink);font-family:var(--f-body);
  background-image:radial-gradient(rgba(124,82,46,0.1) 1px,transparent 1.4px),radial-gradient(rgba(124,82,46,0.07) 1px,transparent 1.4px);
  background-size:23px 23px,31px 31px;background-position:0 0,11px 17px}
.frm{position:absolute;inset:24px;border:3px solid var(--forest);border-radius:10px;pointer-events:none;z-index:1}
.frm::after{content:"";position:absolute;inset:8px;border:1.5px solid var(--forest);border-radius:6px}
.fa .head{position:absolute;left:96px;top:50px;right:96px;height:200px;display:flex;align-items:flex-end;gap:30px}
.fa .ttl{font-size:90px}
.searchby{margin-left:auto;display:flex;align-items:flex-end;gap:22px;padding-bottom:4px}
.sb-note{position:relative;font:700 44px/1 var(--f-hand);color:var(--magenta);transform:rotate(-3deg);text-align:right;padding-right:118px;margin-bottom:34px;white-space:nowrap}
.sb-note svg{position:absolute;right:0;top:4px;width:110px;height:62px;overflow:visible}
.mode{display:inline-flex!important;align-items:center;gap:16px;height:150px;padding:0 32px 0 16px!important;border-radius:24px;white-space:nowrap;
  font:italic 800 52px/1 var(--f-head)!important;color:var(--ink);word-spacing:.08em;border:10px solid transparent!important;
  background:linear-gradient(color-mix(in srgb,var(--c) 15%,var(--warm-white)),color-mix(in srgb,var(--c) 15%,var(--warm-white))) padding-box,
    repeating-linear-gradient(62deg,var(--c) 0 1.8px,color-mix(in srgb,var(--c) 72%,var(--warm-white)) 1.8px 2.7px,color-mix(in srgb,var(--c) 80%,var(--charcoal)) 2.7px 3.6px) border-box!important;
  outline:2.5px dashed color-mix(in srgb,var(--c) 85%,var(--charcoal));outline-offset:-17px;box-shadow:5px 6px 0 -1px rgba(59,61,60,0.28);transform:rotate(var(--r,-1deg))}
.mode .ic{width:92px;height:92px;flex:none;display:grid;place-items:center}
.mode .ic svg{width:100%;height:100%}
.mode small{font:700 24px/1 var(--f-type);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:6px;font-style:normal}
.mode i{font-style:normal;font-size:30px;margin-left:6px;transition:transform .2s;display:inline-block}
.mode[aria-pressed="true"]{background:linear-gradient(var(--c),var(--c)) padding-box,repeating-linear-gradient(62deg,var(--warm-white) 0 1.8px,color-mix(in srgb,var(--c) 40%,var(--warm-white)) 1.8px 3.6px) border-box!important;
  color:var(--warm-white);outline-color:var(--warm-white);transform:rotate(var(--r,-1deg)) translateY(-6px)}
.mode[aria-pressed="true"] small{color:color-mix(in srgb,var(--warm-white) 80%,transparent)}
.mode[aria-pressed="true"] i{transform:rotate(180deg)}
.band{position:absolute;left:96px;right:96px;top:270px;height:100px;display:flex;align-items:center;gap:18px;flex-wrap:nowrap;overflow:hidden}
.band>.lbl{font:700 24px/1.1 var(--f-type);letter-spacing:.16em;text-transform:uppercase;color:var(--forest);white-space:nowrap;margin-right:4px}
.band .hint{font:700 46px/1 var(--f-hand);color:var(--indigo)}
.fa .chip{font-size:29px!important;min-height:86px;padding:12px 20px 14px!important;border-width:7px!important}
.chip b{font:700 20px/1 var(--f-type);margin-left:12px;opacity:.75}
.a-tile.dim{opacity:.22}
.kick{font:700 30px/1 var(--f-type);text-transform:uppercase;letter-spacing:.16em;color:var(--forest);margin:0 0 14px}
.ttl{font-family:var(--f-head);font-style:italic;font-weight:800;font-size:108px;line-height:.95;margin:0;color:var(--rust);word-spacing:.12em;white-space:nowrap}
.ttl .hl{background:linear-gradient(transparent 58%,rgba(242,183,57,0.55) 58%,rgba(242,183,57,0.55) 90%,transparent 90%);padding:0 .08em}
.hnote{font:700 50px/1.02 var(--f-hand);color:var(--magenta);max-width:560px;transform:rotate(-2deg);padding-bottom:6px}
.count{margin-left:auto;display:flex;gap:40px;align-items:flex-end;padding-bottom:12px}
.stat{font:400 26px/1.2 var(--f-type);text-transform:uppercase;letter-spacing:.12em;color:var(--ink-soft);text-align:right}
.stat b{display:block;font:italic 800 84px/1 var(--f-head);letter-spacing:0;color:var(--forest)}
.fa .grid{position:absolute;left:96px;top:392px;width:3648px;height:1690px;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:30px 32px}

.a-mini{margin-top:auto;display:flex;gap:6px;align-items:center}

.a-mini small{font:700 22px/1 var(--f-type);color:var(--ink-soft);margin-left:4px}

.dot.pitch{background:var(--forest)}.dot.talk{background:var(--magenta)}

.rail{grid-column:8/span 3;grid-row:3/span 2;background:var(--paper);border-radius:6px;box-shadow:var(--shadow-paper);padding:40px 44px;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto 1fr auto;gap:22px 40px;transform:rotate(.3deg);min-height:0}

.rail h3{margin:0;font:italic 800 56px/1 var(--f-head);color:var(--rust)}
.step{display:grid;grid-template-columns:52px 1fr;gap:4px 18px}
.step i{grid-row:span 2;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:italic 800 32px/1 var(--f-head);color:var(--warm-white);background:var(--c)}
.step b{font:italic 800 36px/1.05 var(--f-head);color:var(--ink)}
.step span{font-size:25px;line-height:1.3;color:var(--ink-soft)}
.legend{display:flex;flex-direction:column;gap:14px;font-size:24px;color:var(--ink-soft);margin-top:4px}

.c-find{display:flex;flex-wrap:wrap;gap:6px 34px;font:400 25px/1.2 var(--f-type);color:var(--ink);padding-top:16px;border-top:2px dashed rgba(124,82,46,0.2)}

/* A · open spread (round 1-2, kept for reference) */
.a-dim{position:absolute;inset:0;background:rgba(59,61,60,0.55);z-index:5}

.big-ph{--d:580px;width:var(--d);height:var(--d);border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 16px #fff,0 0 0 21px var(--th),0 14px 30px 16px rgba(59,61,60,.14)}

.askme{margin-top:40px;font:700 58px/1.04 var(--f-hand);color:var(--indigo);text-align:center;text-wrap:balance;max-width:1100px}

.sash{display:grid;grid-template-columns:repeat(5,1fr);gap:16px 22px}

.ticket{background:color-mix(in srgb,var(--periwinkle) 55%,var(--paper));padding:34px 46px;border-radius:8px;
  -webkit-mask:radial-gradient(circle 20px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 20px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 20px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 20px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat}
.ticket p,.stick p{margin:0;font-size:32px;line-height:1.38;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

.dlcard{background:var(--plum);color:var(--warm-white);border-radius:12px;padding:44px 50px;display:flex;flex-direction:column;gap:20px}
.dlcard b{font:italic 800 54px/1.02 var(--f-head);color:var(--pink)}
.dlcard p{margin:0;font-size:30px;line-height:1.35}
.dlcard em{font:700 46px/1.04 var(--f-hand);font-style:normal;color:var(--butter)}
.a-ctl{position:absolute;left:50%;transform:translateX(-50%);bottom:50px;z-index:7;display:flex;gap:28px;align-items:center;padding:18px 22px;border-radius:90px;background:#3d3b40}
.btn{height:124px;min-width:124px;padding:0 46px!important;border-radius:62px;background:var(--warm-white);color:var(--ink);font:italic 800 42px/1 var(--f-head);display:inline-flex!important;align-items:center;justify-content:center;gap:18px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.btn.x{background:var(--rust);color:var(--warm-white)}

.a-close{position:absolute;right:-44px;top:-44px;width:120px;height:120px;border-radius:50%;background:var(--rust);color:var(--warm-white);display:grid!important;place-items:center;z-index:8;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.a-close svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round}

/* ================= OPTION B · Patch Night ================= */
.fb{background:radial-gradient(ellipse at 30% 0%,#572c62 0%,var(--plum) 40%,var(--night) 100%);color:var(--warm-white);font-family:var(--f-body)}
.fb::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(color-mix(in srgb,var(--warm-white) 70%,transparent) 1.2px,transparent 1.8px),radial-gradient(rgba(236,157,182,0.6) 1px,transparent 1.6px);
  background-size:97px 89px,151px 137px;background-position:13px 29px,61px 7px}
.fb .frm{border-color:rgba(236,157,182,0.55)}
.fb .frm::after{border-color:rgba(236,157,182,0.35)}
.fb .head{position:absolute;left:96px;top:60px;right:96px;height:190px;display:flex;align-items:flex-end;gap:56px}
.fb .kick{color:var(--pink)}
.fb .ttl{color:var(--warm-white)}
.fb .ttl .hl{background:linear-gradient(transparent 60%,rgba(168,40,107,0.8) 60%,rgba(168,40,107,0.8) 90%,transparent 90%)}
.fb .hnote{color:var(--butter);font-size:48px}
.fb .stat{color:color-mix(in srgb,var(--warm-white) 70%,transparent)}
.fb .stat b{color:var(--pink)}
.bq{display:grid;grid-template-columns:120px auto;gap:6px 18px;align-items:center;padding-bottom:10px}
.bq .qr{width:120px;grid-row:span 2;padding:5%}
.bq b{font:italic 800 34px/1 var(--f-head);color:var(--butter)}
.bq span{font-size:22px;line-height:1.2;color:color-mix(in srgb,var(--warm-white) 80%,transparent);max-width:300px}
.chips{position:absolute;left:96px;right:96px;top:300px;display:flex;gap:22px;align-items:center;flex-wrap:nowrap}
.chips>span{font:700 26px/1 var(--f-type);letter-spacing:.16em;text-transform:uppercase;color:var(--pink);margin-right:6px;white-space:nowrap}
.chip{font:italic 800 32px/1 var(--f-head)!important;white-space:nowrap;border-radius:16px;color:var(--ink);word-spacing:.08em;
  border:8px solid transparent!important;padding:16px 24px 18px!important;min-height:92px;display:inline-flex!important;align-items:center;
  background:linear-gradient(color-mix(in srgb,var(--c) 16%,var(--warm-white)),color-mix(in srgb,var(--c) 16%,var(--warm-white))) padding-box,
    repeating-linear-gradient(62deg,var(--c) 0 1.6px,color-mix(in srgb,var(--c) 72%,var(--warm-white)) 1.6px 2.4px,color-mix(in srgb,var(--c) 80%,var(--charcoal)) 2.4px 3.2px) border-box!important;
  outline:2px dashed color-mix(in srgb,var(--c) 85%,var(--charcoal));outline-offset:-14px}
.chip[aria-pressed="true"]{background:linear-gradient(var(--c),var(--c)) padding-box,repeating-linear-gradient(62deg,var(--warm-white) 0 1.6px,color-mix(in srgb,var(--c) 40%,var(--warm-white)) 1.6px 3.2px) border-box!important;color:var(--tx,var(--warm-white));outline-color:var(--warm-white);transform:translateY(-4px)}
.fb .grid{position:absolute;left:96px;top:450px;width:3648px;height:1610px;display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(3,1fr);gap:20px 12px;transition:width .3s}
.fb .grid.narrow{width:1880px;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:6px 10px}
.b-patch{display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .3s,transform .3s}
.b-patch.dim{opacity:.22}
.b-patch.on{transform:scale(1.06)}
.b-ring{--d:270px;width:var(--d);height:var(--d);border-radius:50%;flex:none;position:relative;
  border:16px solid transparent;
  background:linear-gradient(#fff,#fff) padding-box,repeating-linear-gradient(62deg,var(--th) 0 2px,color-mix(in srgb,var(--th) 70%,var(--warm-white)) 2px 3px,color-mix(in srgb,var(--th) 78%,var(--charcoal)) 3px 4px) border-box;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--th) 55%,var(--charcoal)),0 10px 24px rgba(0,0,0,.45)}
.b-ring::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2.5px dashed color-mix(in srgb,var(--th) 80%,var(--charcoal));pointer-events:none}
.b-ring>span{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.b-patch.on .b-ring{box-shadow:0 0 0 2px var(--charcoal),0 0 0 14px var(--marigold),0 0 60px 20px rgba(242,183,57,0.55)}
.b-tag{font:italic 800 34px/1 var(--f-head);color:var(--ink);white-space:nowrap;border-radius:10px;padding:10px 20px 12px;word-spacing:.06em;
  border:6px solid transparent;background:linear-gradient(color-mix(in srgb,var(--th) 12%,var(--warm-white)),color-mix(in srgb,var(--th) 12%,var(--warm-white))) padding-box,
  repeating-linear-gradient(62deg,var(--th) 0 1.6px,color-mix(in srgb,var(--th) 72%,var(--warm-white)) 1.6px 2.4px) border-box;transform:rotate(var(--rot,0deg))}
.b-gift{font:700 21px/1 var(--f-type);letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--warm-white) 78%,transparent);margin-top:-4px;white-space:nowrap}
.narrow .b-ring{--d:150px;border-width:11px}
.narrow .b-ring::after{inset:4px;border-width:2px}
.narrow .b-tag{font-size:26px;padding:7px 14px 9px;border-width:5px}
.narrow .b-gift{display:none}
.narrow .b-patch{gap:10px}
.b-sheet{position:absolute;left:2040px;top:440px;width:1704px;height:1640px;z-index:6;background:var(--paper);color:var(--ink);border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.55);
  display:grid;grid-template-columns:600px 1fr;grid-template-rows:1fr auto;gap:0 60px;padding:70px 70px 44px 80px;animation:slidein .35s ease-out}
@keyframes slidein{from{transform:translateX(120px);opacity:0}to{transform:none;opacity:1}}
.b-sheet::before{content:"";position:absolute;left:28px;top:30px;bottom:30px;border-left:3px dashed color-mix(in srgb,var(--th) 70%,var(--charcoal))}
.b-sheet .tape{position:absolute;top:-22px;left:300px;width:200px;height:48px;background:var(--tape-clear);border-left:1px solid var(--tape-clear-edge);border-right:1px solid var(--tape-clear-edge);transform:rotate(-3deg)}
.b-left{display:flex;flex-direction:column;align-items:center;gap:22px;min-height:0}
.b-left .b-ring{--d:400px;border-width:24px}
.b-left .b-ring::after{inset:9px;border-width:3px}
.b-left h2{margin:10px 0 0;font:italic 800 88px/.98 var(--f-head);color:var(--rust);text-align:center;text-wrap:balance;word-spacing:.1em}
.b-left .stamps{display:flex;gap:14px;min-height:38px}
.b-left .askme{margin-top:6px;font-size:46px}
.b-left .findme{grid-template-columns:1fr;gap:20px;padding:28px 30px;margin-top:auto}
.b-left .findme dd{font-size:31px}
.b-left .findme .qrrow{display:flex;gap:22px;align-items:center}
.b-left .findme .qr{width:170px;flex:none}
.b-left .findme .qcap{margin:0;text-align:left;font-size:30px;line-height:1.05}
.b-right{display:flex;flex-direction:column;gap:30px;min-height:0;min-width:0}

.b-right .sash .own span,.b-right .sash .open span{height:128px;font-size:26px}

.b-ctl{grid-column:1/-1;display:flex;gap:22px;align-items:center;justify-content:flex-end;padding-top:28px;border-top:2px solid rgba(124,82,46,0.14);margin-top:26px}
.b-ctl .btn{height:112px;min-width:112px;box-shadow:0 4px 0 rgba(59,61,60,0.25);background:var(--oat)}
.b-ctl .btn.x{background:var(--plum)}
.b-ctl .pos{color:var(--ink-soft);margin-right:auto;text-align:left;min-width:0}

/* ---------- phone width: stack the chrome ---------- */
@media (max-width:820px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 62vh auto;height:auto;padding-left:0;padding-right:0}
  .top{flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tools,.file{display:none}
  .left{border:0;border-bottom:1px solid var(--ui-line);display:flex;gap:6px;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-left,0px))}
  .left .ph-title,.left .page-item,.left .layer.sec{display:none}
  .left .layer{width:auto;white-space:nowrap;padding:6px 10px;border:1px solid var(--ui-line)}
  .left .layer.sub{padding-left:10px}
  .right{border:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* REAL build additions */
html,body{margin:0;height:100%;overflow:hidden;background:#141313}
body{user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
#kb{position:absolute;left:0;top:0;transform-origin:0 0}
.a-tile.nopage{cursor:default;opacity:.92}
.mode.off{opacity:.35;filter:grayscale(.6);cursor:default}
.c-links .lts{display:flex;gap:18px;flex-wrap:wrap}
.lt{display:grid!important;grid-template-columns:34px auto;grid-template-rows:auto auto;column-gap:14px;align-items:center;min-height:96px;min-width:220px;padding:12px 22px!important;
 background:var(--warm-white);border:4px solid var(--k,var(--night-blue))!important;border-radius:18px!important;box-shadow:0 4px 0 color-mix(in srgb,var(--k,var(--night-blue)) 40%,transparent)}
.lt:active{transform:translateY(3px) scale(.98)}
.lt i{grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--k,var(--night-blue))}
.lt b{font:700 24px/1.1 var(--f-type);text-transform:uppercase;letter-spacing:.04em;color:var(--charcoal)}
.lt small{font:600 23px/1.2 var(--f-body);color:var(--ink-soft,#6b5a4c)}
.lt.save{--k:#5764A6;min-width:0;width:200px;grid-template-columns:1fr;text-align:center;justify-items:center;row-gap:4px}
.lt.save .qi{grid-row:auto;width:54px;height:54px;border-radius:8px;background:
 conic-gradient(from 0deg,#5764A6 0 25%,transparent 0 50%,#5764A6 0 75%,transparent 0) 0 0/27px 27px;border:5px solid #5764A6}
.a-card.showq>*:not(.qbig):not(.tape){visibility:hidden}
.qbig{position:absolute;inset:0;display:flex;gap:44px;align-items:center;justify-content:center;padding:60px;background:var(--paper);border-radius:10px}
.qpaper{background:#FFF8EC;padding:0;border-radius:4px;flex:none}.qpaper svg{display:block;width:100%;height:auto}

/* ---------- Web views (desktop + mobile). Everything is scoped to #web or to html[data-view] so the TV view is untouched. No guest data. ---------- */
html:not([data-view]) body{visibility:hidden}
#web{display:none}
html[data-view="desktop"] #web,html[data-view="mobile"] #web,html.w-loading #web{display:block}
html[data-view="desktop"] #kb,html[data-view="mobile"] #kb,html.w-loading #kb{display:none}
html[data-view="desktop"],html[data-view="mobile"]{height:auto;overflow:auto;background:#f5ecdb}
html[data-view="desktop"][data-night="1"],html[data-view="mobile"][data-night="1"]{background:#331d42}
html[data-view="desktop"] body,html[data-view="mobile"] body{height:auto;overflow:visible;background:transparent;user-select:auto;-webkit-user-select:auto;overscroll-behavior:auto}
html[data-view].w-lock{overflow:hidden}

 background-size:23px 23px,31px 31px;background-position:0 0,11px 17px}
#web *,#web *::before,#web *::after{box-sizing:border-box}
:where(#web button){appearance:none;-webkit-appearance:none;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

.w-load{margin:0;padding:30vh 24px 0;text-align:center;font:italic 800 28px/1.2 var(--f-head);color:var(--rust)}

 background:color-mix(in srgb,var(--night-blue) 12%,var(--warm-white));color:var(--night-blue)!important;font:700 14px/1 var(--f-type);letter-spacing:.12em;text-transform:uppercase}

}
function pill(m,col,ico,label,off){
  return `<button type="button" class="w-pill${off?' off':''}" ${off?'disabled aria-disabled="true"':`data-w="mode" data-m="${m}"`} aria-pressed="${W.mode===m}" style="--c:${col}"><span class="ic">${ico}</span><span><small>Search by</small>${label}</span><i aria-hidden="true">▾</i></button>`;
}
function paintFilter(){
  const old=$f.querySelector('.w-tray'),keep=old?old.scrollLeft:0;
  let tray='';
  if(W.mode==='gifts'||W.mode==='projects'||W.mode==='home'){
    const col=W.mode==='gifts'?'var(--rust)':W.mode==='home'?'var(--forest)':'var(--night-blue)';
    tray=`<div class="w-tray" style="--c:${col}"><span class="lbl">${W.mode==='gifts'?'Gifts':W.mode==='home'?'Home':'Projects'} ›</span>
<button class="w-chip" type="button" data-w="pick" data-k="" aria-pressed="${!W.sel}" style="--c:var(--pink);--tx:var(--charcoal)">Everyone<b>${C.length}</b></button>
${subs().map(k=>`<button class="w-chip" type="button" data-w="pick" data-k="${k.id}" aria-pressed="${W.sel===k.id}" style="--c:${k.c};--tx:${k.tx||'#FFFAF4'}">${esc(k.n)}<b>${k.count}</b></button>`).join('')}</div>`;
  }
  $f.innerHTML=`<div class="w-filter-in">${pill('gifts','var(--rust)',bsvg(ICON_GIFT),'Gifts')}
${pill('projects','var(--night-blue)','<svg viewBox="0 0 52 46" aria-hidden="true"><use href="#la-tentflag"/></svg>','Projects')}
${tray}</div>`;
  const t=$f.querySelector('.w-tray');
  if(t){t.scrollLeft=keep;
    const b=$f.querySelector('.w-pill[aria-pressed="true"]');
    if(b&&view==='desktop'){const tr=t.getBoundingClientRect(),br=b.getBoundingClientRect();
      t.style.setProperty('--nx',Math.max(26,Math.min(tr.width-26,br.left+br.width/2-tr.left))+'px')}}
}

/* ---------- grid ---------- */
function paintGrid(){
  const list=C.filter(match);
  $g.innerHTML=list.length?list.map(c=>aTile(c,W.open===c.i,false)).join(''):'<p class="w-none">Nobody here yet. Pick another one.</p>';
  const el=document.getElementById('wsr');if(el)el.textContent=W.sel?list.length+(list.length===1?' camper':' campers')+' shown':'';
}

/* ---------- camper panel (side panel on desktop, full-screen sheet on phones) ---------- */
function panelHTML(c){
  const nav=C.filter(x=>x.has),pos=nav.indexOf(c),prev=nav[(pos+nav.length-1)%nav.length],next=nav[(pos+1)%nav.length];
  const items=c.badges.map(id=>`<figure><span>${bsvg(id)}</span><figcaption>${esc(BADGE[id].n)}</figcaption></figure>`)
    .concat(c.own.map(x=>`<figure class="own"><span>✦</span><figcaption>${esc(x.name)}</figcaption></figure>`));
  const links=c.links.filter(l=>okUrl(linkUrl(l)));
  const proj=projBlock(c);const asks=c.links.filter(l=>l.kind==='ask'&&l.cta);
  let h=`<div class="w-id"><span class="c-ph">${photo(c)}</span><div><h2>${esc(c.first)} ${esc(c.last)}</h2><div class="stamps">${stamps(c)}</div>${askme(c)}</div></div>
${proj}${c.bio?'':talkHTML(c)}${thinHTML(c)}
${links.length||asks.length?`<div class="w-links"><p class="sec-k">Join · follow · find me</p><div class="w-lts">${links.map(l=>`<a class="w-lt${l.cta?' cta':''}" href="${esc(linkUrl(l))}" target="_blank" rel="noopener noreferrer" style="--k:${kcol(l)}"><i></i><span><b>${esc(l.cta||kname(l))}</b><small>${esc(l.cta?kname(l)+(l.label?' · '+l.label:''):tileLabel(l))}</small></span></a>`).join('')}${asks.map(l=>`<div class="w-lt cta ask" style="--k:var(--plum)"><i></i><span><b>${esc(l.cta)}</b><small>Ask ${esc(c.first)} in person</small></span></div>`).join('')}</div></div>`:''}
${window.SCRAPBOOK_EDIT?`<a class="w-edit" href="${esc(window.SCRAPBOOK_EDIT.url)}" target="_blank" rel="noopener noreferrer">Is this you? Change or add to your scrapbook page</a>`:''}
<div class="w-contact"><button class="w-save" type="button" data-w="vcard">Add ${esc(c.first)} to contacts</button>${IN_APP?'<p class="w-hint">Open in Safari or Chrome to save contacts</p>':''}</div>
${items.length?`<div class="w-gifts"><p class="sec-k">Gift badges</p><div class="c-sash">${items.join('')}</div></div>`:''}`;
  h=h.split('✦ Passion').join('✦ Passion').split('Passion &amp; expertise').join('Passion &amp; expertise');
  return `<div class="w-ptop"><button class="w-back" type="button" data-w="close" aria-label="Back to the board">${ICON.prev}Back</button><b class="nm">${esc(c.first)} ${esc(c.last)}</b><button class="w-x" type="button" data-w="close" aria-label="Close">${ICON.x}</button></div>
<div class="w-pbody">${h}</div>
<div class="w-pnav"><button class="w-btn" type="button" data-w="prev">${ICON.prev}<span>${esc(prev.first)}</span></button><button class="w-btn" type="button" data-w="next"><span>${esc(next.first)}</span>${ICON.next}</button></div>`;
}
let lockY=null;
function lockBody(){if(lockY!=null)return;lockY=scrollY;root.classList.add('w-lock');const b=document.body.style;b.position='fixed';b.top=-lockY+'px';b.left='0';b.right='0';b.width='100%'}
function unlockBody(){root.classList.remove('w-lock');if(lockY==null)return;const y=lockY,b=document.body.style;lockY=null;b.position=b.top=b.left=b.right=b.width='';scrollTo(0,y)}
function refocus(){if(lastTile&&document.contains(lastTile))lastTile.focus({preventScroll:true})}
function paintPanel(){
  const c=W.open>=0?C[W.open]:null;
  const was=document.activeElement&&$p.contains(document.activeElement)?document.activeElement.dataset.w:null;
  if(c){
    $p.innerHTML=panelHTML(c);$p.style.setProperty('--th',thread(c));$p.setAttribute('aria-label',c.first+' '+c.last+"'s page");
    $p.classList.add('is-open');if(view==='desktop'){root.classList.add('w-split')}else{$s.classList.add('on');$base.inert=true;lockBody()}
    const b=was&&$p.querySelector('[data-w="'+was+'"]');
    const f=b&&b.offsetParent!==null?b:$p.querySelector(view==='mobile'?'.w-back':'.w-x');if(f)f.focus({preventScroll:true});
  }else{
    $p.classList.remove('is-open');root.classList.remove('w-split');$s.classList.remove('on');$base.inert=false;unlockBody();
  }
  $g.querySelectorAll('.a-tile').forEach(t=>t.classList.toggle('is-open',!!c&&+t.dataset.i===c.i));
}
function openCamper(i,fromHash){
  const c=C[i];if(!c||!c.has)return;
  const was=W.open>=0;W.open=i;paintPanel();
  const pb=$p.querySelector('.w-pbody');if(pb)pb.scrollTop=0;
  if(!fromHash){const h='#p='+encodeURIComponent(c.id);
    try{if(!was){history.pushState(null,'',h);W.pushed=true}else history.replaceState(null,'',h)}catch(e){}}
}
function closeCamper(fromHash){
  if(W.open<0)return;
  if(!fromHash){
    if(W.pushed){W.pushed=false;history.back();return}
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  }
  W.open=-1;W.pushed=false;paintPanel();refocus();
}
function step(d){const nav=C.filter(x=>x.has),p=nav.indexOf(C[W.open]);if(p<0)return;openCamper(nav[(p+d+nav.length)%nav.length].i)}
function syncHash(){
  const id=hashVal('p'),t=id==null?-1:C.findIndex(c=>c.id===id&&c.has);
  if(t>=0){if(W.open!==t)openCamper(t,true)}else if(W.open>=0){W.open=-1;W.pushed=false;paintPanel();refocus()}
}

/* ---------- shell ---------- */
function shell(){
  const how='';  /* 2026-11-28: How it works is TV-only */
  $w.innerHTML=`<div id="wbase"><div class="w-top" id="wtop"><span class="w-tt">Scrapbook 2026</span><button class="w-night" type="button" data-w="night" aria-pressed="false"></button></div>
<header class="w-head"><p class="kick">Spirit Camp · Dec 4–6, 2026 · Mendocino coast</p><h1 class="ttl">Camp Counselor Reunion <span class="hl">Scrapbook</span> 2026</h1>
<p class="w-intro">Tap anyone to open their page.</p><p class="w-count" id="wcount"></p><p class="w-sr" id="wsr" role="status" aria-live="polite"></p>${how}</header>
<nav class="w-filter" id="wf" aria-label="Find campers"></nav>
<main class="w-main"><div class="w-grid" id="wg"></div></main></div>
<div class="w-scrim" id="ws" data-w="close"></div><aside class="w-panel" id="wp" role="dialog" aria-modal="true"></aside>`;
  $base=document.getElementById('wbase');$top=document.getElementById('wtop');$f=document.getElementById('wf');$g=document.getElementById('wg');$p=document.getElementById('wp');$s=document.getElementById('ws');
  paintNight();paintFilter();paintGrid();paintPanel();onScroll();
}
function onScroll(){if($top)$top.classList.toggle('on',scrollY>110)}

function setView(v){
  view=v;root.dataset.view=v;
  if(v==='tv'){root.classList.remove('w-lock');$w.innerHTML='';draw();size()}
  else shell();
}

/* ---------- events ---------- */
$w.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-w]');if(!t)return;
  if(t.dataset.act==='open'){lastTile=t;openCamper(+t.dataset.i);return}
  switch(t.dataset.w){
    case 'night':toggleNight();break;
    case 'mode':W.mode=W.mode===t.dataset.m?'':t.dataset.m;W.sel='';paintFilter();paintGrid();break;
    case 'pick':W.sel=t.dataset.k;paintFilter();paintGrid();break;
    case 'close':closeCamper();break;
    case 'prev':step(-1);break;
    case 'next':step(1);break;
    case 'vcard':if(W.open>=0)saveVcard(C[W.open]);break;
  }
});
document.addEventListener('keydown',e=>{
  if(view==='tv'||W.open<0||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Escape')closeCamper();else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);
});
addEventListener('hashchange',()=>{if(view&&view!=='tv')syncHash()});
addEventListener('popstate',()=>{if(view&&view!=='tv')syncHash()});
addEventListener('scroll',onScroll,{passive:true});
let tx=null,ty=0;
$w.addEventListener('touchstart',e=>{if(view!=='mobile'||W.open<0||!e.target.closest('.w-pbody')||e.touches.length!==1){tx=null;return}
  const x0=e.touches[0].clientX;if(x0<20||x0>innerWidth-20){tx=null;return}tx=x0;ty=e.touches[0].clientY},{passive:true});
$w.addEventListener('touchend',e=>{if(tx==null)return;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;tx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2)step(dx<0?1:-1)},{passive:true});
addEventListener('resize',()=>{const v=pickView();if(v!==view&&C.length)setView(v)});

/* ---------- boot: inline data if present, else the feed ---------- */
function loadData(go){
  root.dataset.view=pickView();
  if(window.SCRAPBOOK_DATA)return go(window.SCRAPBOOK_DATA);
  root.classList.add('w-loading');
  const skel=()=>{$w.innerHTML='<div class="w-skel" role="status" aria-label="Scrapbook is loading">'+'<i></i>'.repeat(12)+'</div>'};
  const fail=()=>{$w.innerHTML='<div class="w-load">The scrapbook could not load.<br><button type="button" class="w-retry">Try again</button></div>';
    $w.querySelector('.w-retry').addEventListener('click',run)};
  function run(){
    skel();
    if(!SCRAPBOOK_FEED)return fail();
    const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),12000);
    fetch(SCRAPBOOK_FEED,{cache:'no-store',signal:ac.signal}).then(r=>{if(!r.ok)throw 0;return r.json()})
      .then(R=>{clearTimeout(tm);go(R)},()=>{clearTimeout(tm);fail()});
  }
  run();
}
initNight();
loadData(R=>{
  ingest(R);root.classList.remove('w-loading');
  setView(pickView());
  if(view!=='tv')syncHash();
  if(view==='desktop'&&W.open<0){const i=C.findIndex(c=>c.has);if(i>=0)openCamper(i,true)}  /* 2026-11-28: desktop opens on the first page, split view */
  liveStart(()=>{setView(view||pickView())},()=>W.open>=0);
});
})();
</script>
</body></html>
