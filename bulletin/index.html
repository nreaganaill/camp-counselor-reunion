<style>
@font-face{font-family:"Black Magic";src:url("assets/fonts/BlackMagicSlabSerif.woff2");font-weight:100 900;font-style:normal italic}
@font-face{font-family:"Anonymous Pro";src:url("assets/fonts/AnonymousPro-Bold.woff2");font-weight:600 900}
:root{color-scheme:light;--rust:#BC6A37;--indigo:#494E74;--marigold:#F2B739;--forest:#37524F;--magenta:#A8286B;--night-blue:#5764A6;--walnut:#7C522E;--wa:#25D366;
 --warm-white:#FFFAF4;--ink:#3B3D3C;--ink-soft:#5f615f;--board:#EFE6D6;--paper:#FCF6EE;
 --f-body:"Helvetica Neue",Helvetica,Arial,sans-serif;--f-head:"Black Magic",Georgia,serif;--f-type:"Anonymous Pro","Courier New",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--board);color:var(--ink);font:16px/1.5 var(--f-body);background-image:radial-gradient(rgba(124,82,46,.13) 1.2px,transparent 1.8px);background-size:24px 24px}
main{max-width:1120px;margin:0 auto;padding:28px 18px 40px}
.kick{font:700 12px/1 var(--f-type);letter-spacing:.16em;text-transform:uppercase;color:var(--forest);margin:0 0 10px}
.ttl{font:italic 800 42px/1 var(--f-head);color:var(--rust);margin:0}
.ttl .hl{background:linear-gradient(transparent 58%,rgba(242,183,57,.55) 58%,rgba(242,183,57,.55) 90%,transparent 90%)}
.sub{margin:10px 0 0;font-size:18px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.facts span{font:700 12px/1 var(--f-type);letter-spacing:.08em;text-transform:uppercase;background:var(--warm-white);border:1.5px dashed rgba(55,82,79,.45);border-radius:999px;padding:8px 12px;color:var(--forest)}
/* the intake action: a real button (solid fill, raised edge, arrow, presses down) */
.cta{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:22px 0 0;background:var(--rust);color:#fff;text-decoration:none;
 border-radius:14px;padding:18px 18px 18px 22px;box-shadow:0 5px 0 #8a4a22,0 8px 18px rgba(59,61,60,.25);transition:transform .08s,box-shadow .08s}
.cta:hover{filter:brightness(1.05)}
.steps{display:grid;gap:12px;margin-top:22px}
.stepk{margin:0;font:700 12px/1 var(--f-type);letter-spacing:.14em;text-transform:uppercase;color:var(--walnut)}
.steps .cta{margin:0;justify-content:flex-start}
.cta .n{flex:none;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--rust);display:grid;place-items:center;font:italic 800 22px/1 var(--f-head)}
.cta b small{display:block;margin-top:5px;font:600 15px/1.3 var(--f-body);font-style:normal;opacity:.92}
.cta .go{margin-left:auto}
.cta.two{background:var(--warm-white);color:var(--ink);border:2px solid var(--rust);box-shadow:0 5px 0 rgba(124,82,46,.35)}
.cta.two .n{background:var(--rust);color:#fff}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 #8a4a22,0 3px 8px rgba(59,61,60,.25)}
.cta b{font:italic 800 23px/1.15 var(--f-head)}
.cta .go{flex:none;width:46px;height:46px;border-radius:50%;background:var(--marigold);color:var(--ink);display:grid;place-items:center;font:700 24px/1 var(--f-body)}
.sec{font:700 12px/1 var(--f-type);letter-spacing:.16em;text-transform:uppercase;color:var(--walnut);margin:30px 0 10px}
.phase{position:sticky;top:0;z-index:5;display:flex;gap:6px;padding:8px;margin:-28px -18px 22px;background:rgba(239,230,214,.94);backdrop-filter:blur(6px);border-bottom:1px solid rgba(124,82,46,.2)}
.phase button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border:2px solid var(--pc);border-radius:12px;background:var(--warm-white);color:var(--pc);font:700 14px/1 var(--f-type);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.phase button[aria-pressed=true]{background:var(--pc);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.phase button .em{display:grid}.phase button[data-k=before]{--pc:var(--rust)}.phase button[data-k=after]{--pc:var(--forest)}
body[data-phase=before] [data-p=a],body[data-phase=after] [data-p=b]{display:none!important}
.sticky{display:inline-block;margin-top:14px;padding:12px 16px 14px;background:#FFF3A8;color:var(--ink);transform:rotate(-2deg);box-shadow:2px 5px 10px rgba(59,61,60,.22);font:700 13px/1.6 var(--f-type);letter-spacing:.06em;text-transform:uppercase;position:relative}
.sticky::before{content:"";position:absolute;top:-9px;left:50%;width:64px;height:18px;transform:translateX(-50%) rotate(3deg);background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.06)}
.sticky b{display:block;font:italic 800 18px/1.2 var(--f-head);text-transform:none;letter-spacing:0;color:var(--rust);margin-bottom:2px}
.sticky.after{background:#D7F0E0;transform:rotate(1.5deg)}
@media (min-width:900px){.phase{margin:-48px -56px 30px;padding:10px 56px}.phase button{flex:0 0 220px}}
.tiles{display:grid;gap:12px}
.tile{position:relative;display:flex;gap:14px;align-items:center;background:var(--warm-white);border-radius:4px;padding:26px 14px 14px 12px;text-decoration:none;color:var(--ink);box-shadow:0 1px 1px rgba(59,61,60,.12),0 6px 14px -6px rgba(59,61,60,.35);transform:rotate(var(--tilt,0deg))}
.tile::before{content:"";position:absolute;top:7px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75) 0 2.5px,transparent 3px),var(--c);box-shadow:0 2px 3px rgba(0,0,0,.35);z-index:2}
.tiles .tile:nth-child(3n+1){--tilt:-.6deg}.tiles .tile:nth-child(3n+2){--tilt:.5deg}.ways .tile:nth-child(2){--tilt:.4deg}
.th{width:72px;height:56px;flex:none;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.pol{width:116px;height:86px;background:#fff;padding:3px;border-radius:5px;box-shadow:0 3px 8px rgba(0,0,0,.22)}
.th svg.big{width:44px;height:44px}
.th.pol img{border-radius:2px}
.th svg{width:32px;height:32px}
.th .emo{font-size:34px;line-height:1}
.ln{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font:italic 800 20px/1.1 var(--f-head)}
.tile .s{display:block;font-size:14px;color:var(--ink-soft);margin-top:2px}
.tag{position:absolute;top:-8px;right:10px;font:700 10px/1 var(--f-type);font-style:normal;letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--forest);color:#fff}
div.tile{cursor:default}
.phase button:focus-visible,a:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.arrow{margin-left:auto;font:700 20px/1 var(--f-type);color:var(--c)}
.reach{margin-top:28px;background:var(--paper);border:1px solid rgba(73,78,116,.18);border-radius:14px;padding:16px 16px 18px}
.reach h2{margin:0 0 12px;font:italic 800 24px/1.1 var(--f-head);color:var(--indigo)}
.ways{display:grid;gap:10px}

.tile{min-width:0;box-sizing:border-box}.tile>span:not(.th):not(.arrow){min-width:0;flex:1}.tile .s{overflow-wrap:anywhere}
.ways .s{font-size:13px;letter-spacing:-.01em}

.soc .handle{background:#9A5228}
.foot{margin-top:22px;font:700 11px/1.4 var(--f-type);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.soc{margin-top:28px;background:var(--warm-white);border-radius:18px;padding:22px 16px 24px;text-align:center;box-shadow:2px 3px 0 rgba(59,61,60,.12);border:1px solid rgba(124,82,46,.18);overflow:hidden}
.soc h2{margin:0 0 6px;font:italic 800 30px/1.1 var(--f-head);color:var(--forest)}
.soc p{margin:0 auto 4px;font-size:15px;max-width:34ch}
.snaps{position:relative;display:flex;justify-content:center;align-items:center;margin:18px auto 8px;padding:6px 0 4px;max-width:520px}
.snap{position:relative;flex:0 1 32%;margin:0 -2.5%;background:#fff;padding:6px 6px 18px;box-shadow:0 6px 14px rgba(59,61,60,.28)}

.snap:before{content:"";position:absolute;top:-9px;left:50%;width:44%;height:16px;margin-left:-22%;background:rgba(242,183,57,.55);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(59,61,60,.15)}
.snap:nth-child(1){transform:rotate(-5deg);z-index:1}.snap:nth-child(2){transform:rotate(3deg);z-index:2}.snap:nth-child(3){transform:rotate(-2deg);z-index:1}

.handle{position:relative;display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:16px 26px;min-height:56px;border-radius:999px;text-decoration:none;color:var(--warm-white);font:700 22px/1 var(--f-type);letter-spacing:.02em;background:var(--rust);box-shadow:0 5px 0 #8a4a22;transform:rotate(-2deg);transition:transform .15s,box-shadow .15s}
.handle:before{content:"";position:absolute;inset:5px;border:2px dashed var(--marigold);border-radius:999px;pointer-events:none}
.handle svg{width:26px;height:26px;fill:var(--warm-white);flex:none}
.handle:hover{transform:rotate(-2deg) translateY(-2px);box-shadow:0 7px 0 #8a4a22}
.handle:active{transform:rotate(-2deg) translateY(3px);box-shadow:0 2px 0 #8a4a22}
.sbtns{margin-top:22px;display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.sb{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font:700 12px/1 var(--f-type);letter-spacing:.12em;text-transform:uppercase;min-width:64px;min-height:44px}
.sb .patch{position:relative;display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:var(--pc);box-shadow:0 4px 0 rgba(59,61,60,.28);transition:transform .15s,box-shadow .15s}
.sb .patch:before{content:"";position:absolute;inset:5px;border:2px dashed rgba(255,250,244,.75);border-radius:50%}
.sb .patch svg{width:30px;height:30px;fill:var(--warm-white);position:relative}
.sb:hover .patch{transform:translateY(-3px);box-shadow:0 7px 0 rgba(59,61,60,.25)}
.sb:active .patch{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,61,60,.28)}
@media(min-width:700px){.snap{padding:9px 9px 26px}.snaps{max-width:620px}.cam{width:72px;height:58px;right:-18px}.soc h2{font-size:38px}}
@media (prefers-reduced-motion:reduce){.handle,.sb .patch{transition:none!important}}
.rev{margin-top:28px;background:linear-gradient(160deg,#FFF6DA,#FCE6D3);border:2px solid var(--marigold);border-radius:18px;padding:22px 18px;text-align:center;box-shadow:3px 4px 0 rgba(188,106,55,.25)}
.stars{font-size:30px;letter-spacing:4px;color:var(--marigold);text-shadow:0 1px 0 #b9851a}
.rev h2{margin:6px 0 6px;font:italic 800 28px/1.1 var(--f-head);color:var(--rust)}
.rev p{margin:0 auto 16px;max-width:46ch;font-size:16px}
.rbtns{display:grid;gap:10px}
.rb{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:10px 14px;text-decoration:none;color:var(--ink);font:italic 800 18px/1.1 var(--f-head);box-shadow:0 3px 0 rgba(59,61,60,.15)}
.rb svg{width:36px;height:36px;flex:none}.rb .arrow{color:var(--rust)}
@media (min-width:900px){.rbtns{grid-template-columns:repeat(3,1fr);max-width:820px;margin:0 auto}.rev{padding:30px}}
@media (min-width:900px){
 main{padding:48px 56px 56px}
 .top{display:grid;grid-template-columns:1.2fr 1fr;gap:44px;align-items:end}
 .ttl{font-size:62px}.cta{margin:0}
 .tiles{grid-template-columns:repeat(3,1fr)}
 .ways{grid-template-columns:1fr 1fr}
}

main{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));padding-bottom:max(40px,calc(env(safe-area-inset-bottom) + 24px))}

}

function setPhase(k){document.body.dataset.phase=k;document.querySelectorAll('.phase button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k))}

/* default phase: "before" until Dec 6, 2026 (local date), then "after"; ?phase=before|after overrides */
const q=new URLSearchParams(location.search).get('phase');
setPhase(q==='before'||q==='after'?q:(new Date()>=new Date(2026,11,6)?'after':'before'));
